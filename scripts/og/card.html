<!doctype html>

<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap");

			* { box-sizing: border-box; margin: 0; }

			body {
				width: 1200px;
				height: 630px;
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				padding: 72px 80px;
				background: #fbfaf7;
				color: #1c1b19;
				font-family: "IBM Plex Sans", system-ui, sans-serif;
			}

			.wordmark { font-family: "IBM Plex Mono", monospace; font-size: 30px; font-weight: 600; }
			.wordmark span { color: #c2410c; }

			h1 { font-size: 86px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 600; }

			.lede { margin-top: 24px; font-size: 30px; line-height: 1.4; color: #55524c; max-width: 24ch; }

			.meta { display: flex; gap: 14px; font-family: "IBM Plex Mono", monospace; font-size: 22px; }

			.chip {
				padding: 10px 18px;
				border: 1px solid #e4e0d8;
				border-radius: 6px;
				background: #ffffff;
				color: #55524c;
			}

			.chip.accent { border-color: #c2410c; color: #c2410c; }
		</style>
	</head>
	<body>
		<p class="wordmark">styleguide<span>.fyi</span></p>
		<div>
			<h1>Coding style guide.</h1>
			<p class="lede">59 rules, each with the reason behind it.</p>
		</div>
		<div class="meta">
			<span class="chip accent">styleguide.md</span>

		</div>
	</body>
</html>
